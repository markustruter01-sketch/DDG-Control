<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ddg.limited — preview (iPhone size)</title>
<meta name="robots" content="noindex" />
<style>
  /* Preview only: ddg.limited (site.html) shown at the size of an iPhone 15 / 16 screen, 393 x 852 points,
     with the scene settings panel moved out beside the phone so it does not cover the screen. */
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #05060a; color: #cfd8e3; font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; overflow: hidden; }
  .bar { flex: none; display: flex; gap: 14px; align-items: center; justify-content: center; padding: 10px 360px 6px 12px; width: 100%; box-sizing: border-box; color: #8fa2b5; }
  .bar a, .bar button { color: #9fd8ff; background: none; border: 1px solid rgba(159,216,255,.35); border-radius: 999px; padding: 4px 12px; font: inherit; cursor: pointer; text-decoration: none; }
  .bar a:hover, .bar button:hover { background: rgba(159,216,255,.1); }
  .stage { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; padding-right: 344px; box-sizing: border-box; min-height: 0; }
  .phone { --w: 393px; --h: 852px; position: relative; width: calc(var(--w) + 24px); height: calc(var(--h) + 24px); flex: none;
    border-radius: 68px; background: #111318; box-shadow: 0 0 0 2px #2a2e36, 0 0 0 4px #0b0c10, 0 30px 80px rgba(0,0,0,.7);
    transform-origin: center center; }
  .screen { position: absolute; inset: 12px; border-radius: 56px; overflow: hidden; background: #000; }
  .status { position: absolute; left: 0; right: 0; top: 0; height: 54px; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: 0 34px 0 40px;
    color: #fff; font: 600 16px/1 -apple-system, ui-sans-serif, system-ui, sans-serif; background: #000; pointer-events: none; }
  .island { position: absolute; left: 50%; top: 11px; width: 125px; height: 36px; margin-left: -62.5px; border-radius: 20px; background: #000; box-shadow: 0 0 0 1px #15171c; z-index: 3; }
  .status i { font-style: normal; letter-spacing: 1px; font-size: 13px; }
  iframe { position: absolute; left: 0; top: 54px; width: 100%; height: calc(100% - 54px); border: 0; display: block; background: #07080b; }
  .home { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: rgba(255,255,255,.75); z-index: 3; pointer-events: none; }
  .note { color: #5f6f80; font: 11px/1.3 ui-monospace, Menlo, monospace; max-width: 520px; }
  /* Small windows: the panel goes under the phone's bar, and the phone takes the whole width. */
  @media (max-width: 820px) { .stage { padding-right: 0; } .bar { padding-right: 12px; } }
</style>
</head>
<body>
  <div class="bar">
    <span>iPhone 15 / 16 · 393 × 852</span>
    <button type="button" id="reload">Reload phone</button>
    <a href="./site.html" target="_blank" rel="noopener">Open full size ↗</a>
    <span class="note" id="note"></span>
  </div>
  <div class="stage">
    <div class="phone" id="phone">
      <div class="screen">
        <div class="status"><span id="clock">9:41</span><i>●●● ◢ ▮</i></div>
        <div class="island"></div>
        <iframe id="site" src="./site.html" title="ddg.limited at iPhone size" allow="vibrate"></iframe>
        <div class="home"></div>
      </div>
    </div>
  </div>
<script>
  // Fit the phone in the window (it is drawn smaller on short screens, never larger than real size).
  const phone = document.getElementById('phone'), stage = phone.parentElement;
  const fit = () => {
    const r = stage.getBoundingClientRect(), pad = parseFloat(getComputedStyle(stage).paddingRight) || 0;
    const s = Math.min(1, (r.height - 16) / phone.offsetHeight, (r.width - pad - 16) / phone.offsetWidth);
    phone.style.transform = s < 1 ? `scale(${s.toFixed(3)})` : '';
  };
  addEventListener('resize', fit); fit();
  const pad2 = (n) => String(n).padStart(2, '0');
  const tick = () => { const d = new Date(); document.getElementById('clock').textContent = `${d.getHours() % 12 || 12}:${pad2(d.getMinutes())}`; };
  tick(); setInterval(tick, 20000);

  // The scene settings panel lives inside the phone's page. Move it out, beside the phone, with its styles.
  // Its buttons and sliders keep working: their code still runs in the phone's page.
  const frame = document.getElementById('site');
  let moved = null;
  const movePanel = () => {
    let doc; try { doc = frame.contentDocument; } catch { return; }
    if (!doc) return;
    const panel = doc.querySelector('.tune');
    if (!panel || panel === moved) return;
    for (const st of doc.querySelectorAll('style')) {
      if (st.textContent.includes('.tune {') && !document.getElementById('tune-css')) {
        const c = document.createElement('style'); c.id = 'tune-css'; c.textContent = st.textContent; document.head.appendChild(c);
      }
    }
    document.querySelectorAll('body > .tune').forEach((old) => old.remove());
    document.body.appendChild(document.adoptNode(panel));
    moved = panel;
    document.getElementById('note').textContent = '';
  };
  setInterval(movePanel, 400);
  // The preview's status line (scroll, orb, charge, frames a second) is shown up here, not over the phone's screen.
  setInterval(() => {
    let doc; try { doc = frame.contentDocument; } catch { return; }
    const line = doc && [...doc.querySelectorAll('body > div')].find((d) => /^scroll /.test(d.textContent || ''));
    if (!line) return;
    line.style.visibility = 'hidden';
    document.getElementById('note').textContent = line.textContent;
  }, 300);
  frame.addEventListener('load', () => { moved = null; });
  document.getElementById('reload').addEventListener('click', () => { document.querySelectorAll('body > .tune').forEach((p) => p.remove()); moved = null; frame.contentWindow.location.reload(); });
</script>
</body>
</html>
