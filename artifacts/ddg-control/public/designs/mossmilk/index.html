<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Moss &amp; Milk: concept design by DDG</title>
<style>
  :root { --bg: #f3ede4; --ink: #2b2620; --soft: #6e655a; --moss: #5d6b48; --clay: #c9a27e; --card: #fbf8f3; }
  body.pm { --bg: #1e1b22; --ink: #efe8dc; --soft: #a69d92; --moss: #9fb08a; --clay: #8e7aa8; --card: #29252e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.6 "Avenir Next", "Segoe UI", system-ui, sans-serif; transition: background .8s, color .8s; }
  .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-weight: 400; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 22px 6vw; }
  .logo { font-size: 24px; letter-spacing: .02em; }
  .ampm { display: flex; border: 1px solid var(--soft); border-radius: 999px; padding: 3px; }
  .ampm button { border: 0; background: none; padding: 12px 18px; min-height: 44px; border-radius: 999px; font: inherit; font-size: 14px; color: var(--soft); cursor: pointer; }
  .ampm button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 6vw; align-items: center; padding: 6vh 6vw 12vh; }
  h1 { font-size: clamp(44px, 6vw, 96px); line-height: 1; margin: 0 0 22px; letter-spacing: -.02em; }
  h1 i { color: var(--moss); }
  .lede { color: var(--soft); max-width: 26em; font-size: 19px; }
  .jarwrap { position: relative; display: grid; place-items: center; min-height: 460px; }
  .blob { position: absolute; width: 420px; height: 420px; border-radius: 42% 58% 61% 39% / 46% 38% 62% 54%; background: var(--clay); opacity: .35; animation: morph 14s ease-in-out infinite; transition: background .8s; }
  @keyframes morph { 50% { border-radius: 58% 42% 37% 63% / 55% 61% 39% 45%; transform: rotate(40deg); } }
  .jar { position: relative; width: 210px; }
  .lens { position: absolute; width: 150px; height: 150px; border-radius: 50%; pointer-events: none; border: 2px solid var(--ink); background: var(--card); box-shadow: 0 20px 40px -20px rgba(0,0,0,.4); display: grid; place-items: center; text-align: center; padding: 18px; font-size: 13px; opacity: 0; transform: scale(.6); transition: opacity .2s, transform .2s; }
  .lens.on { opacity: 1; transform: scale(1); }
  .lens b { display: block; font-size: 15px; }
  .ingr { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 26px; }
  .ingr button { border: 1px solid var(--soft); background: none; border-radius: 999px; padding: 10px 16px; font: inherit; font-size: 14px; color: var(--ink); cursor: pointer; }
  .ingr button:hover, .ingr button:focus-visible { background: var(--ink); color: var(--bg); }
  section { padding: 10vh 6vw; }
  h2 { font-size: clamp(34px, 4.4vw, 64px); margin: 0 0 36px; line-height: 1.05; }
  .shelf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .p { background: var(--card); border-radius: 30px; padding: 26px; transition: background .8s, transform .3s; }
  .p:hover { transform: translateY(-6px); }
  .p .pic { height: 220px; border-radius: 22px; display: grid; place-items: end center; overflow: hidden; }
  .p h3 { margin: 18px 0 4px; font-size: 24px; }
  .p .row { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
  .add { border: 0; border-radius: 999px; background: var(--ink); color: var(--bg); padding: 12px 18px; font: inherit; font-size: 14px; cursor: pointer; }
  .drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(380px, 92vw); background: var(--card); box-shadow: -30px 0 60px -30px rgba(0,0,0,.4); transform: translateX(105%); transition: transform .45s cubic-bezier(.2,.8,.2,1); z-index: 10; padding: 28px; }
  .drawer.open { transform: none; }
  .drawer h3 { margin: 0 0 18px; font-size: 26px; }
  .drawer button.x { position: absolute; top: 20px; right: 20px; width: 44px; height: 44px; border: 1px solid var(--soft); background: none; border-radius: 50%; color: var(--ink); font-size: 18px; cursor: pointer; }
  footer { padding: 30px 6vw 90px; font-size: 14px; color: var(--soft); display: flex; justify-content: space-between; }
  .concept { position: fixed; left: 12px; bottom: 12px; z-index: 9; padding: 6px 12px; border-radius: 999px; background: rgba(43,38,32,.88); color: #fff; font: 500 11px/1.3 system-ui, sans-serif; }
  @media (max-width: 860px) { .hero, .shelf { grid-template-columns: 1fr; } .jarwrap { min-height: 360px; order: -1; } .blob { width: 300px; height: 300px; } }
  @media (prefers-reduced-motion: reduce) { .blob { animation: none; } }
</style>
</head>
<body>
<header>
  <span class="logo serif">Moss &amp; Milk</span>
  <div class="ampm" role="group" aria-label="Routine"><button aria-pressed="true" data-m="am">Morning</button><button aria-pressed="false" data-m="pm">Night</button></div>
</header>
<section class="hero">
  <div>
    <h1 class="serif" id="h1">Skin care that <i>slows</i> you down.</h1>
    <p class="lede" id="lede">Three steps, plant-led, nothing you can't pronounce. Point at an ingredient to see what it does.</p>
    <div class="ingr" role="group" aria-label="Ingredients">
      <button data-i="Oat milk|Calms redness and itch.">Oat milk</button>
      <button data-i="Moss extract|Holds water in the skin.">Moss extract</button>
      <button data-i="Squalane|Light oil, no shine.">Squalane</button>
      <button data-i="Niacinamide|Evens tone over weeks.">Niacinamide</button>
    </div>
  </div>
  <div class="jarwrap">
    <div class="blob" aria-hidden="true"></div>
    <svg class="jar" viewBox="0 0 210 260" role="img" aria-label="A jar of cream">
      <rect x="35" y="20" width="140" height="44" rx="10" fill="#2b2620"/>
      <rect x="20" y="58" width="170" height="180" rx="30" fill="#fbf8f3" stroke="#2b2620" stroke-width="3"/>
      <rect x="20" y="120" width="170" height="64" fill="#5d6b48"/>
      <text x="105" y="160" text-anchor="middle" fill="#fbf8f3" font-family="Georgia, serif" font-size="20">Moss &amp; Milk</text>
    </svg>
    <div class="lens" id="lens" role="status"><div><b id="lt"></b><span id="lp"></span></div></div>
  </div>
</section>
<section>
  <h2 class="serif" id="h2">Your morning three.</h2>
  <div class="shelf" id="shelf"></div>
</section>
<footer><span>Moss &amp; Milk · a made-up brand</span><span>[Price] · free delivery over [amount]</span></footer>
<aside class="drawer" id="drawer" aria-label="Bag"><button class="x" id="x" aria-label="Close bag">✕</button><h3 class="serif">Your bag</h3><ul id="items"></ul></aside>
<div class="concept">Concept design by DDG · not a real business</div>
<script>
  const sets = {
    am: { h2: 'Your morning three.', lede: 'Three steps, plant-led, nothing you can’t pronounce. Point at an ingredient to see what it does.', items: [['Milk Wash', 'Gentle cleanser', '#e8dccb'], ['Moss Mist', 'Hydrating toner', '#c9d3b8'], ['Day Balm', 'Light moisturiser', '#efd9c2']] },
    pm: { h2: 'Your night three.', lede: 'Slower, richer, made for sleep. The page dims with you.', items: [['Oil Melt', 'Make-up remover', '#3d3746'], ['Night Serum', 'Niacinamide 5%', '#4a3f5c'], ['Sleep Balm', 'Rich overnight cream', '#5a4a52']] },
  };
  const shelf = document.getElementById('shelf'), drawer = document.getElementById('drawer'), items = document.getElementById('items');
  const render = (m) => {
    document.body.classList.toggle('pm', m === 'pm'); h2.textContent = sets[m].h2; lede.textContent = sets[m].lede; shelf.innerHTML = '';
    sets[m].items.forEach(([n, d, c]) => {
      const el = document.createElement('div'); el.className = 'p';
      el.innerHTML = `<div class="pic" style="background:${c}"><svg viewBox="0 0 120 150" style="height:88%;width:auto" aria-hidden="true"><rect x="38" y="6" width="44" height="22" rx="4" fill="#2b2620"/><rect x="28" y="26" width="64" height="118" rx="18" fill="#fbf8f3"/><rect x="28" y="70" width="64" height="30" fill="${c}"/></svg></div><h3 class="serif">${n}</h3><p style="margin:0;color:var(--soft)">${d}</p><div class="row"><span>[$]</span><button class="add">Add to bag</button></div>`;
      el.querySelector('.add').onclick = () => { const li = document.createElement('li'); li.textContent = n; items.append(li); drawer.classList.add('open'); };
      shelf.append(el);
    });
  };
  document.querySelectorAll('.ampm button').forEach((b) => b.onclick = () => { document.querySelectorAll('.ampm button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); render(b.dataset.m); });
  document.getElementById('x').onclick = () => drawer.classList.remove('open');
  render('am');
  const lens = document.getElementById('lens');
  document.querySelectorAll('.ingr button').forEach((b) => {
    const on = () => { const [t, p] = b.dataset.i.split('|'); lt.textContent = t; lp.textContent = p; lens.classList.add('on'); };
    b.addEventListener('pointerenter', on); b.addEventListener('focus', on); b.addEventListener('click', on);
    b.addEventListener('pointerleave', () => lens.classList.remove('on')); b.addEventListener('blur', () => lens.classList.remove('on'));
  });
</script>
</body>
</html>
