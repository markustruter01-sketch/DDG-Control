kind = "web"
previewPath = "/"
title = "DDG Website + Control"
description = "Public DDG website at /, with DDG Control (owner only, 2FA) at a secret path."
version = "1.0.0"
id = "artifacts/ddg-control"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26196

[services.development]
run = "pnpm --filter @workspace/ddg-control run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ddg-control", "run", "build" ]
serve = "static"
publicDir = "artifacts/ddg-control/dist/public"

# DDG Control at its secret path (folder name set in vite.config.ts), then the public website.
[[services.production.rewrites]]
from = "/ctl-3gv376wpguby/*"
to = "/ctl-3gv376wpguby/index.html"

# The DDG Finance showcase (display only), shown inside ddg.limited/live/finance.
[[services.production.rewrites]]
from = "/live-finance/*"
to = "/live-finance/index.html"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26196"
BASE_PATH = "/"
