openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: projects
    description: Project operations
  - name: members
    description: Member operations
  - name: tasks
    description: Task operations
  - name: goals
    description: Goal operations
  - name: metrics
    description: Project metric operations
  - name: agents
    description: Agent run operations
  - name: inbound
    description: Key-protected inbound operations for Cursor
  - name: finance
    description: Finance ledger operations
  - name: social
    description: Social audience numbers per venture
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email, password and a 6-digit authenticator code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many failed login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Authentication is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
  /session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Check the current session
      responses:
        "200":
          description: Session is authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Authentication is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      description: Returns all projects sorted by sort_order
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
  /projects/{slug}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      description: Returns one project by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  error:
                    type: string
                    const: not found
                required: [error]
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project's status, description, or Drive folder link
      description: Updates only the supplied project fields.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdateRequest"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid update
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  error:
                    type: string
                required: [error]
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  error:
                    type: string
                    const: not found
                required: [error]
  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List task owners
      description: Returns all task owners sorted by id.
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
  /projects/{slug}/tasks:
    get:
      operationId: listProjectTasks
      tags: [tasks]
      summary: List project tasks
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project tasks sorted by status, then creation time.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createProjectTask
      tags: [tasks]
      summary: Create a project task
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid task input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid task update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{slug}/goals:
    get:
      operationId: listProjectGoals
      tags: [goals]
      summary: List project goals
      description: Returns goals sorted by status, target date with empty dates last, then creation time.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createProjectGoal
      tags: [goals]
      summary: Create a project goal
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Created goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          description: Invalid goal input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /goals/{id}:
    patch:
      operationId: updateGoal
      tags: [goals]
      summary: Update a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdate"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          description: Invalid goal update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Goal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{slug}/metrics/refresh:
    post:
      operationId: refreshProjectMetrics
      tags: [metrics]
      summary: Refresh project metrics from its data source
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Saved metric snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMetricsResponse"
        "400":
          description: No data source is configured for this project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The metrics data source returned an error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The metrics data source is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{slug}/metrics:
    get:
      operationId: listProjectMetrics
      tags: [metrics]
      summary: Get the latest project metric snapshots
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Latest metric snapshot for each available metric
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMetricsResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/cattle-dog-coffee/profit:
    get:
      operationId: getCattleDogCoffeeProfit
      tags: [metrics]
      summary: Get the live Cattle Dog Coffee profit summary
      responses:
        "200":
          description: Live store profit summary with net profit after charity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CattleDogCoffeeProfitResponse"
        "502":
          description: The store returned an error or an invalid response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Store access is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{slug}/daily-sales:
    get:
      operationId: listProjectDailySales
      tags: [metrics]
      summary: Get the latest 30 Brisbane calendar days of sales
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Daily sales totals, oldest day first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailySalesResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{slug}/metrics/history:
    get:
      operationId: listProjectMetricHistory
      tags: [metrics]
      summary: Get the latest 90 snapshots for one metric
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Metric history, oldest snapshot first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricHistoryResponse"
        "400":
          description: Invalid metric key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{slug}/ollie-history:
    get:
      operationId: listProjectOllieHistory
      tags: [agents]
      summary: Get the latest 30 Heimdall updates for a project
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Heimdall update history, oldest update first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OllieHistoryResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{slug}/notes:
    get:
      operationId: listProjectNotes
      tags: [projects]
      summary: List a project's inbound notes
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project notes, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectNotesResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /agents/ollie/run:
    post:
      operationId: runOllie
      tags: [agents]
      summary: Run Heimdall's daily dashboard report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OllieRunRequest"
      responses:
        "200":
          description: Completed or failed Heimdall run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Heimdall already ran today or is currently running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Heimdall or xAI is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /cursor/models:
    get:
      operationId: listCursorModels
      tags: [agents]
      summary: Read the Cursor Cloud Agent models available to this account
      description: Read-only model discovery. This does not start an agent or confirm model billing is included in the user's plan.
      responses:
        "200":
          description: Cursor API key is missing or the account's available model list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorModelsResponse"
        "502":
          description: Cursor could not return a valid model list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /agents/ollie/cron:
    post:
      operationId: runOllieCron
      tags: [agents]
      summary: Run Heimdall's daily dashboard report with a scheduler token
      responses:
        "200":
          description: Completed or failed Heimdall run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
        "401":
          description: Missing or invalid scheduler token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Heimdall already ran today or is currently running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Scheduler token is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /agents/runs:
    get:
      operationId: listAgentRuns
      tags: [agents]
      summary: List the latest 20 agent runs
      responses:
        "200":
          description: Latest agent runs with member names
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentRunWithMember"
  /agent-updates/latest:
    get:
      operationId: listLatestAgentUpdates
      tags: [agents]
      summary: List the latest Heimdall update for each project
      responses:
        "200":
          description: Latest Heimdall project updates; projects without updates are omitted
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LatestAgentProjectUpdate"
  /social/summary:
    get:
      operationId: getSocialSummary
      tags: [social]
      summary: Latest social audience numbers per venture, with 30-day change
      responses:
        "200":
          description: Social summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialSummaryResponse"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /social/snapshots:
    post:
      operationId: createSocialSnapshot
      tags: [social]
      summary: Record one reading of a venture's numbers on one platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialSnapshotCreate"
      responses:
        "201":
          description: Reading recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialSnapshot"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /finance/debts:
    get:
      operationId: listFinanceDebts
      tags: [finance]
      summary: List debts
      responses:
        "200":
          description: Debt ledger entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceDebtListResponse"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createFinanceDebt
      tags: [finance]
      summary: Create a debt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceDebtCreate"
      responses:
        "201":
          description: Debt created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceDebt"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /finance/debts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    patch:
      operationId: updateFinanceDebt
      tags: [finance]
      summary: Update a debt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceDebtPatch"
      responses:
        "200":
          description: Debt updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceDebt"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Debt not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteFinanceDebt
      tags: [finance]
      summary: Delete a debt
      responses:
        "200":
          description: Debt deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceDeleteResponse"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Debt not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /finance/expenses:
    get:
      operationId: listFinanceExpenses
      tags: [finance]
      summary: List expenses
      responses:
        "200":
          description: Expense ledger entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceExpenseListResponse"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createFinanceExpense
      tags: [finance]
      summary: Create an expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceExpenseCreate"
      responses:
        "201":
          description: Expense created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceExpense"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /finance/expenses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    patch:
      operationId: updateFinanceExpense
      tags: [finance]
      summary: Update an expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceExpensePatch"
      responses:
        "200":
          description: Expense updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceExpense"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Expense not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteFinanceExpense
      tags: [finance]
      summary: Delete an expense
      responses:
        "200":
          description: Expense deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceDeleteResponse"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Expense not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /finance/revenue:
    get:
      operationId: listFinanceRevenue
      tags: [finance]
      summary: List manual revenue entries
      responses:
        "200":
          description: Revenue ledger entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceRevenueListResponse"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createFinanceRevenue
      tags: [finance]
      summary: Create a manual revenue entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceRevenueCreate"
      responses:
        "201":
          description: Revenue entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceRevenue"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /finance/revenue/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    patch:
      operationId: updateFinanceRevenue
      tags: [finance]
      summary: Update a manual revenue entry
