openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: projects
    description: Project operations
  - name: members
    description: Member operations
  - name: tasks
    description: Task operations
  - name: goals
    description: Goal operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with the admin password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many failed login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Authentication is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
  /session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Check the current session
      responses:
        "200":
          description: Session is authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Authentication is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      description: Returns all projects sorted by sort_order
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
  /projects/{slug}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      description: Returns one project by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  error:
                    type: string
                    const: not found
                required: [error]
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project's status or description
      description: Updates only the supplied project fields.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdateRequest"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid update
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  error:
                    type: string
                required: [error]
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  error:
                    type: string
                    const: not found
                required: [error]
  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List task owners
      description: Returns all task owners sorted by id.
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
  /projects/{slug}/tasks:
    get:
      operationId: listProjectTasks
      tags: [tasks]
      summary: List project tasks
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project tasks sorted by status, then creation time.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createProjectTask
      tags: [tasks]
      summary: Create a project task
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid task input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid task update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{slug}/goals:
    get:
      operationId: listProjectGoals
      tags: [goals]
      summary: List project goals
      description: Returns goals sorted by status, target date with empty dates last, then creation time.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createProjectGoal
      tags: [goals]
      summary: Create a project goal
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Created goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          description: Invalid goal input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /goals/{id}:
    patch:
      operationId: updateGoal
      tags: [goals]
      summary: Update a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdate"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          description: Invalid goal update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Goal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    LoginInput:
      type: object
      additionalProperties: false
      properties:
        password:
          type: string
      required: [password]
    LoginResult:
      type: object
      additionalProperties: false
      properties:
        ok:
          type: boolean
          const: true
      required: [ok]
    SessionResult:
      type: object
      additionalProperties: false
      properties:
        authenticated:
          type: boolean
          const: true
        dev_bypass:
          type: boolean
      required: [authenticated, dev_bypass]
    ProjectUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          description: Must be one of PROJECT_STATUSES from the shared project constants.
        description:
          type: ["string", "null"]
          maxLength: 2000
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Project:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
        sort_order:
          type: integer
        created_at:
          type: ["string", "null"]
          format: date-time
      required:
        - id
        - slug
        - name
        - description
        - status
        - sort_order
        - created_at
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
      required: [error]
    Member:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          type: string
          description: Must be one of MEMBER_KINDS from the shared project constants.
        created_at:
          type: ["string", "null"]
          format: date-time
      required: [id, name, kind, created_at]
    Task:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        project_id:
          type: integer
        title:
          type: string
        notes:
          type: ["string", "null"]
        status:
          type: string
          description: Must be one of TASK_STATUSES from the shared project constants.
        owner_id:
          type: integer
        due_date:
          type: ["string", "null"]
          format: date
        completed_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: ["string", "null"]
          format: date-time
        updated_at:
          type: ["string", "null"]
          format: date-time
      required:
        - id
        - project_id
        - title
        - notes
        - status
        - owner_id
        - due_date
        - completed_at
        - created_at
        - updated_at
    TaskInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        owner_id:
          type: integer
          minimum: 1
        notes:
          type: ["string", "null"]
          maxLength: 2000
        status:
          type: string
          description: Must be one of TASK_STATUSES from the shared project constants.
        due_date:
          type: ["string", "null"]
          format: date
      required: [title, owner_id]
    TaskUpdate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: ["string", "null"]
          maxLength: 2000
        status:
          type: string
          description: Must be one of TASK_STATUSES from the shared project constants.
        owner_id:
          type: integer
          minimum: 1
        due_date:
          type: ["string", "null"]
          format: date
    Goal:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        project_id:
          type: integer
        title:
          type: string
        notes:
          type: ["string", "null"]
        status:
          type: string
          description: Must be one of GOAL_STATUSES from the shared project constants.
        target_date:
          type: ["string", "null"]
          format: date
        achieved_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: ["string", "null"]
          format: date-time
        updated_at:
          type: ["string", "null"]
          format: date-time
      required:
        - id
        - project_id
        - title
        - notes
        - status
        - target_date
        - achieved_at
        - created_at
        - updated_at
    GoalInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: ["string", "null"]
          maxLength: 2000
        status:
          type: string
          description: Must be one of GOAL_STATUSES from the shared project constants.
        target_date:
          type: ["string", "null"]
          format: date
      required: [title]
    GoalUpdate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: ["string", "null"]
          maxLength: 2000
        status:
          type: string
          description: Must be one of GOAL_STATUSES from the shared project constants.
        target_date:
          type: ["string", "null"]
          format: date

