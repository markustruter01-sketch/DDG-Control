openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: projects
    description: Project operations
  - name: members
    description: Member operations
  - name: tasks
    description: Task operations
  - name: goals
    description: Goal operations
  - name: metrics
    description: Project metric operations
  - name: agents
    description: Agent run operations
  - name: inbound
    description: Key-protected inbound operations for Cursor
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with the admin password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many failed login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Authentication is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
  /session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Check the current session
      responses:
        "200":
          description: Session is authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Authentication is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      description: Returns all projects sorted by sort_order
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
  /projects/{slug}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      description: Returns one project by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  error:
                    type: string
                    const: not found
                required: [error]
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project's status, description, or Drive folder link
      description: Updates only the supplied project fields.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdateRequest"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid update
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  error:
                    type: string
                required: [error]
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  error:
                    type: string
                    const: not found
                required: [error]
  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List task owners
      description: Returns all task owners sorted by id.
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
  /projects/{slug}/tasks:
    get:
      operationId: listProjectTasks
      tags: [tasks]
      summary: List project tasks
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project tasks sorted by status, then creation time.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createProjectTask
      tags: [tasks]
      summary: Create a project task
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid task input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid task update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{slug}/goals:
    get:
      operationId: listProjectGoals
      tags: [goals]
      summary: List project goals
      description: Returns goals sorted by status, target date with empty dates last, then creation time.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createProjectGoal
      tags: [goals]
      summary: Create a project goal
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Created goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          description: Invalid goal input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /goals/{id}:
    patch:
      operationId: updateGoal
      tags: [goals]
      summary: Update a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdate"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          description: Invalid goal update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Goal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{slug}/metrics/refresh:
    post:
      operationId: refreshProjectMetrics
      tags: [metrics]
      summary: Refresh project metrics from its data source
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Saved metric snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMetricsResponse"
        "400":
          description: No data source is configured for this project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The metrics data source returned an error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The metrics data source is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{slug}/metrics:
    get:
      operationId: listProjectMetrics
      tags: [metrics]
      summary: Get the latest project metric snapshots
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Latest metric snapshot for each available metric
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMetricsResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{slug}/daily-sales:
    get:
      operationId: listProjectDailySales
      tags: [metrics]
      summary: Get the latest 30 Brisbane calendar days of sales
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Daily sales totals, oldest day first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailySalesResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{slug}/metrics/history:
    get:
      operationId: listProjectMetricHistory
      tags: [metrics]
      summary: Get the latest 90 snapshots for one metric
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Metric history, oldest snapshot first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricHistoryResponse"
        "400":
          description: Invalid metric key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{slug}/ollie-history:
    get:
      operationId: listProjectOllieHistory
      tags: [agents]
      summary: Get the latest 30 Ollie updates for a project
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ollie update history, oldest update first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OllieHistoryResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{slug}/notes:
    get:
      operationId: listProjectNotes
      tags: [projects]
      summary: List a project's inbound notes
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project notes, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectNotesResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /agents/ollie/run:
    post:
      operationId: runOllie
      tags: [agents]
      summary: Run Ollie's daily dashboard report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OllieRunRequest"
      responses:
        "200":
          description: Completed or failed Ollie run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Ollie already ran today or is currently running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Ollie or xAI is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /agents/ollie/cron:
    post:
      operationId: runOllieCron
      tags: [agents]
      summary: Run Ollie's daily dashboard report with a scheduler token
      responses:
        "200":
          description: Completed or failed Ollie run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
        "401":
          description: Missing or invalid scheduler token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Ollie already ran today or is currently running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Scheduler token is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /agents/runs:
    get:
      operationId: listAgentRuns
      tags: [agents]
      summary: List the latest 20 agent runs
      responses:
        "200":
          description: Latest agent runs with member names
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentRunWithMember"
  /agent-updates/latest:
    get:
      operationId: listLatestAgentUpdates
      tags: [agents]
      summary: List the latest Ollie update for each project
      responses:
        "200":
          description: Latest Ollie project updates; projects without updates are omitted
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LatestAgentProjectUpdate"
  /decisions:
    get:
      operationId: listDecisions
      tags: [decisions]
      summary: List decisions by status
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: string
            description: Must be one of DECISION_STATUSES from the shared project constants.
      responses:
        "200":
          description: Decisions newest first with project and owner names
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DecisionWithNames"
        "400":
          description: Missing or invalid decision status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /decisions/{id}/approve:
    post:
      operationId: approveDecision
      tags: [decisions]
      summary: Approve a pending decision and create its task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionActionBody"
      responses:
        "200":
          description: Approved decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
        "400":
          description: Invalid decision id or request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Decision not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Decision is not pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /decisions/{id}/decline:
    post:
      operationId: declineDecision
      tags: [decisions]
      summary: Decline a pending decision
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionActionBody"
      responses:
        "200":
          description: Declined decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
        "400":
          description: Invalid decision id or request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Decision not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Decision is not pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /inbound/state:
    get:
      operationId: getInboundState
      tags: [inbound]
      summary: Read pending decisions, open tasks, projects, and members
      security:
        - InboundBearerAuth: []
      responses:
        "200":
          description: Current state for Ollie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundStateResponse"
        "401":
          description: Missing or invalid inbound key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Inbound key is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /inbound/decisions:
    post:
      operationId: postInboundDecision
      tags: [inbound]
      summary: Record or decide a decision from Cursor
      security:
        - InboundBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboundDecisionInput"
      responses:
        "200":
          description: Recorded and decided decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
        "400":
          description: Invalid request, project, owner, title, or date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid inbound key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Decision not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Decision is not pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Inbound key is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /inbound/tasks/{id}/status:
    post:
      operationId: postInboundTaskStatus
      tags: [inbound]
      summary: Update a task status from Cursor
      security:
        - InboundBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboundTaskStatusInput"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid task id or status body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid inbound key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Inbound key is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /inbound/notes:
    post:
      operationId: postInboundNote
      tags: [inbound]
      summary: Post a risk, incident, or update note
      security:
        - InboundBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboundNoteInput"
      responses:
        "200":
          description: Stored note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundNoteResponse"
        "400":
          description: Invalid request or unknown project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid inbound key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Inbound key is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    InboundBearerAuth:
      type: http
      scheme: bearer
  schemas:
    InboundStateResponse:
      type: object
      additionalProperties: false
      properties:
        pending_decisions:
          type: array
          items:
            $ref: "#/components/schemas/InboundPendingDecision"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/InboundOpenTask"
        project_slugs:
          type: array
          items:
            type: string
        member_names:
          type: array
          items:
            type: string
      required: [pending_decisions, tasks, project_slugs, member_names]
    InboundPendingDecision:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        project_slug:
          type: string
        title:
          type: string
        recommendation:
          type: string
      required: [id, project_slug, title, recommendation]
    InboundOpenTask:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        project_slug:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [planned, in_progress, needs_approval, done, blocked]
        owner_name:
          type: string
        due_date:
          type: ["string", "null"]
          format: date
      required: [id, project_slug, title, status, owner_name, due_date]
    InboundDecisionInput:
      oneOf:
        - $ref: "#/components/schemas/InboundDecisionByIdInput"
        - $ref: "#/components/schemas/InboundDecisionCreateInput"
    InboundDecisionByIdInput:
      type: object
      additionalProperties: false
      properties:
        decision_id:
          type: integer
          minimum: 1
        outcome:
          type: string
          enum: [approved, declined]
        note:
          type: string
          maxLength: 500
      required: [decision_id, outcome]
    InboundDecisionCreateInput:
      type: object
      additionalProperties: false
      properties:
        project_slug:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 200
        summary:
          type: string
          minLength: 1
          maxLength: 300
        owner_name:
          type: string
        due_date:
          type: ["string", "null"]
          format: date
        outcome:
          type: string
          enum: [approved, declined]
        note:
          type: string
          maxLength: 500
      required: [project_slug, title, summary, owner_name, outcome]
    InboundTaskStatusInput:
      type: object
      additionalProperties: false
      properties:
        status:
