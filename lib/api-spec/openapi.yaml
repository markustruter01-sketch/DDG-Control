openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Project operations
  - name: members
    description: Member operations
  - name: tasks
    description: Task operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      description: Returns all projects sorted by sort_order
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
  /projects/{slug}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      description: Returns one project by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  error:
                    type: string
                    const: not found
                required: [error]
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project's status or description
      description: Updates only the supplied project fields.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdateRequest"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid update
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  error:
                    type: string
                required: [error]
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  error:
                    type: string
                    const: not found
                required: [error]
  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List task owners
      description: Returns all task owners sorted by id.
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
  /projects/{slug}/tasks:
    get:
      operationId: listProjectTasks
      tags: [tasks]
      summary: List project tasks
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project tasks sorted by status, then creation time.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createProjectTask
      tags: [tasks]
      summary: Create a project task
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid task input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid task update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    ProjectUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          description: Must be one of PROJECT_STATUSES from the shared project constants.
        description:
          type: ["string", "null"]
          maxLength: 2000
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Project:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
        sort_order:
          type: integer
        created_at:
          type: ["string", "null"]
          format: date-time
      required:
        - id
        - slug
        - name
        - description
        - status
        - sort_order
        - created_at
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
      required: [error]
    Member:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          type: string
          description: Must be one of MEMBER_KINDS from the shared project constants.
        created_at:
          type: ["string", "null"]
          format: date-time
      required: [id, name, kind, created_at]
    Task:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        project_id:
          type: integer
        title:
          type: string
        notes:
          type: ["string", "null"]
        status:
          type: string
          description: Must be one of TASK_STATUSES from the shared project constants.
        owner_id:
          type: integer
        due_date:
          type: ["string", "null"]
          format: date
        completed_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: ["string", "null"]
          format: date-time
        updated_at:
          type: ["string", "null"]
          format: date-time
      required:
        - id
        - project_id
        - title
        - notes
        - status
        - owner_id
        - due_date
        - completed_at
        - created_at
        - updated_at
    TaskInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        owner_id:
          type: integer
          minimum: 1
        notes:
          type: ["string", "null"]
          maxLength: 2000
        status:
          type: string
          description: Must be one of TASK_STATUSES from the shared project constants.
        due_date:
          type: ["string", "null"]
          format: date
      required: [title, owner_id]
    TaskUpdate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: ["string", "null"]
          maxLength: 2000
        status:
          type: string
          description: Must be one of TASK_STATUSES from the shared project constants.
        owner_id:
          type: integer
          minimum: 1
        due_date:
          type: ["string", "null"]
          format: date

