                $ref: "#/components/schemas/FleetHistoryResponse"
components:
  securitySchemes:
    InboundBearerAuth:
      type: http
      scheme: bearer
  schemas:
    InboundStateResponse:
      type: object
      additionalProperties: false
      properties:
        pending_decisions:
          type: array
          items:
            $ref: "#/components/schemas/InboundPendingDecision"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/InboundOpenTask"
        project_slugs:
          type: array
          items:
            type: string
        member_names:
          type: array
          items:
            type: string
        finance:
          $ref: "#/components/schemas/FinanceSummaryResponse"
        trading:
          oneOf:
            - $ref: "#/components/schemas/FleetTradingSnapshot"
            - type: string
              enum: [unavailable]
      required:
        - pending_decisions
        - tasks
        - project_slugs
        - member_names
        - finance
        - trading
    InboundFinanceExpenseCreateInput:
      type: object
      additionalProperties: false
      properties:
        project_slug:
          type: ["string", "null"]
          description: Null represents Company.
        name:
          type: string
          minLength: 1
          maxLength: 100
        kind:
          type: string
          description: Must be one of EXPENSE_KINDS from the shared project constants.
        amount_cents:
          type: integer
          format: int64
          minimum: 1
        spent_on:
          type: ["string", "null"]
          format: date
          description: Required and non-null for one_off; null for recurring_monthly.
        active:
          type: boolean
          default: true
        note:
          type: ["string", "null"]
          maxLength: 300
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 64
      required: [project_slug, name, kind, amount_cents, spent_on]
    InboundFinanceRevenueCreateInput:
      type: object
      additionalProperties: false
      properties:
        project_slug:
          type: ["string", "null"]
          description: Null represents Company.
        name:
          type: string
          minLength: 1
          maxLength: 100
        amount_cents:
          type: integer
          format: int64
          minimum: 1
        received_on:
          type: string
          format: date
        note:
          type: ["string", "null"]
          maxLength: 300
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 64
      required: [project_slug, name, amount_cents, received_on]
    InboundPendingDecision:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        project_slug:
          type: string
        title:
          type: string
        recommendation:
          type: string
      required: [id, project_slug, title, recommendation]
    InboundOpenTask:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        project_slug:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [planned, in_progress, needs_approval, done, blocked]
        owner_name:
          type: string
        due_date:
          type: ["string", "null"]
          format: date
      required: [id, project_slug, title, status, owner_name, due_date]
    InboundDecisionInput:
      oneOf:
        - $ref: "#/components/schemas/InboundDecisionByIdInput"
        - $ref: "#/components/schemas/InboundDecisionCreateInput"
    InboundDecisionByIdInput:
      type: object
      additionalProperties: false
      properties:
        decision_id:
          type: integer
          minimum: 1
        outcome:
          type: string
          enum: [approved, declined]
        note:
          type: string
          maxLength: 500
      required: [decision_id, outcome]
    InboundDecisionCreateInput:
      type: object
      additionalProperties: false
      properties:
        project_slug:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 200
        summary:
          type: string
          minLength: 1
          maxLength: 300
        owner_name:
          type: string
        due_date:
          type: ["string", "null"]
          format: date
        outcome:
          type: string
          enum: [approved, declined]
        note:
          type: string
          maxLength: 500
      required: [project_slug, title, summary, owner_name, outcome]
    InboundTaskStatusInput:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [planned, in_progress, needs_approval, done, blocked]
      required: [status]
    InboundNoteInput:
      type: object
      additionalProperties: false
      properties:
        project_slug:
          type: string
        kind:
          type: string
          enum: [risk, incident, update]
        severity:
          type: string
          enum: [low, medium, high]
        text:
          type: string
          minLength: 1
          maxLength: 300
      required: [project_slug, kind, severity, text]
    InboundNoteResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        project_slug:
          type: string
        kind:
          type: string
          enum: [risk, incident, update]
        severity:
          type: string
          enum: [low, medium, high]
        text:
          type: string
        created_at:
          type: ["string", "null"]
          format: date-time
      required: [id, project_slug, kind, severity, text, created_at]
    LoginInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 200
        password:
          type: string
          maxLength: 500
        code:
          type: string
          pattern: "^[0-9]{6}$"
      required: [email, password, code]
    LoginResult:
      type: object
      additionalProperties: false
      properties:
        ok:
          type: boolean
          const: true
      required: [ok]
    SessionResult:
      type: object
      additionalProperties: false
      properties:
        authenticated:
          type: boolean
          const: true
        dev_bypass:
          type: boolean
      required: [authenticated, dev_bypass]
    ProjectUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          description: Must be one of PROJECT_STATUSES from the shared project constants.
        description:
          type: ["string", "null"]
          maxLength: 2000
        drive_url:
          description: A Google Drive URL, an empty string to clear it, or null.
          anyOf:
            - type: string
              maxLength: 500
              pattern: '^https://drive\.google\.com/'
            - type: string
              maxLength: 0
            - type: "null"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Project:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        drive_url:
          type: ["string", "null"]
        status:
          type: string
        sort_order:
          type: integer
        created_at:
          type: ["string", "null"]
          format: date-time
      required:
        - id
        - slug
        - name
        - description
        - drive_url
        - status
        - sort_order
        - created_at
    OverviewResponse:
      type: object
      additionalProperties: false
      properties:
        read_at:
          type: string
          format: date-time
        money:
          $ref: "#/components/schemas/OverviewMoney"
        social:
          $ref: "#/components/schemas/OverviewSocial"
        businesses:
          $ref: "#/components/schemas/OverviewBusinesses"
      required: [read_at, money, social, businesses]
    OverviewBusinesses:
      type: object
      additionalProperties: false
      description: Key numbers per business card. A whole business is null when its source can't be read.
      properties:
        finance:
          oneOf:
            - $ref: "#/components/schemas/OverviewFinance"
            - type: "null"
        coffee:
          oneOf:
            - $ref: "#/components/schemas/OverviewCoffee"
            - type: "null"
        fitness:
          oneOf:
            - $ref: "#/components/schemas/OverviewFitness"
            - type: "null"
        creative:
          $ref: "#/components/schemas/OverviewCreative"
      required: [finance, coffee, fitness, creative]
    OverviewFinance:
      type: object
      additionalProperties: false
      description: Latest hourly push from DDG Finance, US$ cents.
      properties:
        as_of:
          type: string
        mode:
          type: string
        total_equity_cents:
          type: integer
        total_starting_cents:
          type: integer
        bots:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              bot_id:
                type: string
              equity_cents:
                type: integer
              starting_cents:
                type: integer
              paused:
                type: boolean
              stale:
                type: boolean
            required: [bot_id, equity_cents, starting_cents, paused, stale]
      required: [as_of, mode, total_equity_cents, total_starting_cents, bots]
    OverviewCoffee:
